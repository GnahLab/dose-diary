<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>투약 기록</title>
<style>
  html, body { height: 100%; margin: 0; background: #f3f5f7; color: #13202c; }
  @media (prefers-color-scheme: dark) {
    html, body { background: #10161c; color: #eef2f5; }
  }
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  p {
    margin: 0; padding: 24px 16px;
    font: 18px/1.5 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  }
</style>
</head>
<body>
<noscript><p>이 페이지는 자바스크립트를 켜야 열립니다.</p></noscript>
<script>
  /*
   * 환자용 껍데기 페이지.
   * 주소의 토큰(?t=…)을 읽어 Apps Script 웹앱을 화면 전체 크기로 끼워 넣기만 한다.
   * 기록 저장과 검증은 모두 웹앱이 하며, 이 페이지는 아무것도 저장하지 않는다.
   *
   * ▼ Apps Script 웹앱 주소(…/exec)를 따옴표 안에 붙여넣는다. 고칠 곳은 이 한 줄뿐이다.
   */
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyzjHLeXsWAkxr4JyJcVYC5owqdHnenrOdTRp6FOfPcgyZkUkqTSYfAjeqkEIekdA/exec';

  (function () {
    function say(text) {
      var p = document.createElement('p');
      p.textContent = text;
      document.body.appendChild(p);
    }

    var valid = /^https:\/\/script\.google\.com\/(macros|a\/macros\/[^\/]+)\/s\/[A-Za-z0-9_-]+\/exec$/;
    if (!valid.test(WEB_APP_URL)) {
      say('페이지 설정이 끝나지 않았습니다. 연구 담당자에게 문의해 주세요.');
      return;
    }

    var query = new URLSearchParams(location.search);
    var src = WEB_APP_URL + '?t=' + encodeURIComponent(query.get('t') || '');
    if (query.get('v')) src += '&v=' + encodeURIComponent(query.get('v'));

    var frame = document.createElement('iframe');
    frame.title = '투약 기록';
    frame.src = src;
    document.body.appendChild(frame);
  })();
</script>
</body>
</html>
